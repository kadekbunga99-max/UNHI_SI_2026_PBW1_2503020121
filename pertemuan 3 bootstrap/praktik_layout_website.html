<!doctype html>
<html>
  <head>
    <title>Belajar Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- membuat header website -->
    <header class="bg-primary text-white text-center p-3">
      <h1>My Website</h1>
      <p>Belajar Bootstrap</p>
    </header>

    <!-- membuat navbar responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">MySite</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Produk</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- membuat section hero -->
    <section class="bg-light text-center p-5">
      <h1>Selamat Datang</h1>
      <p>Website modern dengan Bootstrap</p>
      <button class="btn btn-primary">Mulai Sekarang</button>
    </section>

    <!-- membuat section card atau produk -->
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <img src="produk1.jpg" class="card-img-top" />
            <div class="card-body">
              <h5 class="card-title">Produk 1</h5>
              <p class="card-text">Deskripsi produk</p>
              <button class="btn btn-success">Beli</button>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card">
            <img src="produk2.jpg" class="card-img-top" />
            <div class="card-body">
              <h5 class="card-title">Produk 2</h5>
              <p class="card-text">Deskripsi produk</p>
              <button class="btn btn-success">Beli</button>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card">
            <img src="produk3.jpg" class="card-img-top" />
            <div class="card-body">
              <h5 class="card-title">Produk 3</h5>
              <p class="card-text">Deskripsi produk</p>
              <button class="btn btn-success">Beli</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- membuat footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
      <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
