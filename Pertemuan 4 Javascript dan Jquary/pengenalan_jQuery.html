<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- cara menggunakan jQuery (CDN) -->
    <script src="="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    //struktur dasar jQuery
    <script>
        $(document).ready(function() {
// kode jQuery
//selector jQuery
$("#judul").text("Judul Baru");
//javascript (vanilla JS)
document.getElementById("judul").innerHTML = "Hello";
//jQuery
$("#judul").html("Hello");
//contoh program sederhana jQuery
$(document).ready(function() {
$("#btn").click(function() {
$("#judul").text("Judul Baru dengan jQuery");
});
});
});

    </script>
</body>
</html>
