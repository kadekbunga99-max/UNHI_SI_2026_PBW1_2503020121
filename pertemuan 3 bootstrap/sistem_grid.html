<!doctype html>
<html>
  <head>
    <title>Belajar Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- container -->
    <div class="container">Konten website</div>

    <!-- container fluid -->
    <div class="container-fluid">Konten full layar</div>

    <!-- konsep row -->
    <div class="container">
      <div class="row">Konten dalam baris</div>
    </div>

    <!-- konsep column -->
    <div class="row">
      <div class="col">Kolom 1</div>

      <div class="col">Kolom 2</div>
    </div>

    <!-- pembagian kolom -->
    <div class="row">
      <div class="col-6">Kolom kiri</div>

      <div class="col-6">Kolom kanan</div>
    </div>

    <!-- contoh lain pembagian kolom -->
    <div class="row">
      <div class="col-4">Kolom 1</div>
      <div class="col-4">Kolom 2</div>
      <div class="col-4">Kolom 3</div>
    </div>

    <!-- membuat layout sederhana -->
    <div class="container">
      <div class="row">
        <div class="col-3">Sidebar kiri</div>

        <div class="col-6">Konten utama</div>

        <div class="col-3">Sidebar kanan</div>
      </div>
    </div>

    <!-- nested grid-->
    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-6">Nested Kolom 1</div>

            <div class="col-6">Nested Kolom 2</div>
          </div>
        </div>

        <div class="col-6">Kolom utama</div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
