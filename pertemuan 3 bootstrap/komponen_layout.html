<!doctype html>
<html>
  <head>
    <title>Belajar Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- margin & padding utilities -->
    <div class="mt-5 p-3 bg-light">Konten dengan margin atas dan padding</div>

    <!-- display utilities -->
    <div class="d-none">Elemen ini disembunyikan</div>

    <!-- contoh lain -->
    <div class="d-block">Elemen block</div>

    <!-- flexbox utilities -->
    <div class="d-flex">
      <div class="p-2">Item 1</div>
      <div class="p-2">Item 2</div>
      <div class="p-2">Item 3</div>
    </div>

    <!-- contoh flexbox dengan jarak -->
    <div class="d-flex justify-content-between">
      <div>Menu 1</div>
      <div>Menu 2</div>
    </div>

    <!-- alignment utilities -->

    <!-- vertical alignment dengan flexbox -->
    <div class="d-flex align-items-center" style="height: 200px">
      Konten berada di tengah secara vertikal
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
