<!doctype html>
<html>
  <head>
    <title>Belajar Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- heading (h1-h6) -->
    <p class="h1">Teks seperti H1</p>
    <p class="h3">Teks seperti H3</p>

    <!-- text alignment -->
    <p class="text-center">Teks di tengah</p>
    <p class="text-end">Teks di kanan</p>

    <!-- text color -->
    <p class="text-primary">Teks biru</p>
    <p class="text-danger">Teks merah</p>

    <!-- font weight -->
    <p class="fw-bold">Teks tebal</p>
    <p class="fw-light">Teks tipis</p>

    <!-- lead text -->
    <p class="lead">Ini adalah teks utama yang lebih menonjol</p>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
