<!doctype html>
<html>
  <head>
    <title>Belajar Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- button -->
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>

    <!-- card -->
    <div class="card" style="width: 18rem">
      <div class="card-body">
        <h5 class="card-title">Judul Card</h5>
        <p class="card-text">Isi konten card</p>
        <a href="#" class="btn btn-primary">Detail</a>
      </div>
    </div>

    <!-- alert -->
    <div class="alert alert-success">Data berhasil disimpan!</div>
    <div class="alert alert-danger">Terjadi kesalahan!</div>

    <!-- badge -->
    <h3>Pesan <span class="badge bg-primary">5</span></h3>

    <!-- badge dalam buttton -->
    <button class="btn btn-primary">
      Notifikasi <span class="badge bg-light text-dark">3</span>
    </button>

    <!-- list group -->
    <ul class="list-group">
      <li class="list-group-item">Item 1</li>
      <li class="list-group-item">Item 2</li>
      <li class="list-group-item">Item 3</li>
    </ul>

    <!-- list group dengan akitf/interaktif -->
    <ul class="list-group">
      <li class="list-group-item active">Item aktif</li>
      <li class="list-group-item">Item lainnya</li>
    </ul>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
